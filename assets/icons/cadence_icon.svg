<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <!-- background -->
    <rect x="0" y="0" width="512" height="512" fill="#F5F1E8"/>

    <!-- the mark: an open "C" ring, thicker where the voice is strong,
         thinning toward the gap — where the pause-dot sits before it continues -->
    <path
      d="M 340 150
         A 130 130 0 1 0 340 362"
      fill="none"
      stroke="#2A1B4E"
      stroke-width="46"
      stroke-linecap="round"
    />

    <!-- the pause: a held breath before the next sound -->
    <circle cx="352" cy="256" r="22" fill="#2A1B4E"/>
  </g>
</svg>
